# lidar_top 서브시스템 parameter file
#
# 파라미터 이름과 허용 값은 ouster-ros 의 config/driver_params.yaml 을 따른다.
# https://github.com/ouster-lidar/ouster-ros
# 대조한 버전: ros-jazzy-ouster-ros 0.15.1-1noble.20260920.234152
#
# 실장치 기준으로 채웠다 (2026-11-06 확인):
#   센서   OS-2-128, SN 992134000971, prod_pn 840-102146-D, IP 10.5.5.87
#   호스트 enp1s0 10.5.5.1/24
#
# udp_dest 가 호스트 NIC 주소와 다르면 센서가 수신자 없는 주소로 데이터를 보낸다.
# 점검 규칙 R2(must_match_host_nic_ip)가 이 값을 호스트 NIC 와 대조한다.
# 발견 시점의 센서 설정은 udp_dest=192.168.0.3 이었다 — 이전 네트워크 잔재다.

/ouster/os_driver:
  ros__parameters:
    sensor_hostname: "10.5.5.87"
    udp_dest: "10.5.5.1"
    lidar_mode: "1024x10"
    # 포트를 못박는다. 비워 두면 드라이버가 0 으로 선언하고 클라이언트가 임의
    # 포트를 잡은 뒤 센서를 그 포트로 재설정한다. 2026-11-06 실측:
    #   [WARN] lidar port set to zero, the client will assign a random port number!
    # 관리되는 설정에서 매번 바뀌는 포트는 방화벽 규칙과 되읽기를 모두 무의미하게
    # 만든다. 센서의 기존 값과 드라이버 기본값이 모두 7502/7503 이다.
    lidar_port: 7502
    imu_port: 7503
    timestamp_mode: TIME_FROM_INTERNAL_OSC
    # LEGACY 외의 프로파일은 FW 2.2 이상이 필요하다. 이 센서는 v2.1.2 라
    # 프로파일 개념 자체가 없다. 드라이버는 다른 값을 줘도 조용히 LEGACY 로
    # 떨어진다(2026-11-09 실측):
    #   [ouster::sensor] [warning] No lidar profile found. Using LEGACY lidar profile
    # 그래서 장치 실제값을 적는다. 거짓 값을 두면 저장값과 런타임 파라미터는
    # 일치하는데 장치만 다른 상태가 되고, drift 가 0 으로 보인다.
    # FW 를 2.2 이상으로 올리면 RNG19_RFL8_SIG16_NIR16 로 바꾼다.
    udp_profile_lidar: LEGACY
    point_type: original
    proc_mask: "IMU|PCL|SCAN|IMG|RAW|TLM"
