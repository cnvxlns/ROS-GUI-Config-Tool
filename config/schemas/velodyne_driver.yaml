driver: velodyne_driver
match:
  node_name_regex: "^/velodyne_driver_node$"

params:
  device_ip:
    description: "드라이버가 수신할 패킷의 송신 IP 필터. 센서 자체의 IP는 장치에서 설정한다."
    layer: driver
    apply: restart
    tier: engineer
  port:
    description: "드라이버의 UDP 수신 포트. 센서의 데이터 송신 포트와 일치해야 한다."
    layer: driver
    apply: restart
    tier: engineer
  rpm:
    description: "드라이버가 스캔을 묶을 때 사용하는 회전수. 물리 모터 속도는 장치에서 설정한다."
    layer: driver
    apply: restart
    tier: engineer
  model:
    description: "현재 포인트클라우드 변환기에 설정된 VLP-16 보정 파일과 일치해야 한다."
    layer: driver
    apply: restart
    tier: read_only
  use_sim_time:
    description: "실센서 실행에서 false로 고정한다."
    layer: driver
    apply: restart
    tier: read_only
