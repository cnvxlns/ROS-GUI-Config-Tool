# 노드 ↔ systemd 유닛 ↔ parameter file 매핑 (명세 §11.2)
#
# 읽는 방법:
#   - nodes 는 배열이다. unit 하나가 노드 여러 개를 띄울 수 있고, 재시작은
#     unit 단위로만 가능하다. 계획 단계(§6.1)는 이 관계로 restart 집합을 계산한다.
#   - param_files 의 순서가 저장값을 결정한다(§5.1). 뒤에 오는 파일이 앞을 덮으므로
#     global.yaml 이 노드별 값을 덮는다. 이는 의도된 순서다.
#   - global.yaml 이 모든 unit 에 포함되므로 전역 값 변경은 전체 unit 에 영향을 준다.

subsystems:
  lidar_top:
    unit: av-lidar-top.service
    launch: "ros2 launch av_bringup lidar_top.launch.py"
    param_files: [params/lidar_top.yaml, params/global.yaml]
    nodes: ["/ouster/os_driver"]
    # 점검 규칙이 감시할 주요 토픽 (§9.1)
    topics:
      - { name: "/ouster/points", expect_hz: 10.0 }

# camera_front 와 perception 은 장착된 장치가 없어 등록하지 않는다. 등록되지 않은
# 노드는 저장할 parameter file 이 없어 읽기 전용으로 보인다(명세 §11.2, README 4장).
# 장치가 붙으면 UI 의 온보딩 화면이 이 파일에 넣을 조각을 만들어 준다.
#
# unit 여러 개나 오프라인 노드가 필요한 테스트는 서브시스템 3개를 가진 픽스처를
# 쓴다: src/av_config/test/fixtures/config/
