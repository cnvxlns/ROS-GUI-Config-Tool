    tier: engineer
    # enum: []          # 허용 값이 정해져 있으면 적는다
    # global_ref: frames.TODO   # 전역 frame 규칙을 따른다면
    lock_while_driving: true

  lidar_frame_azimuth_offset:
    # 타입 int, 현재값 -1
    # 설명 출처: 드라이버의 parameter file 주석
    description: "The lidar frame azimuth offset for the sensor to use in millidegrees; values range [0, 360000], default -1 (unset; requires FW 3.2+)"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  lidar_mode:
    # 타입 string, 현재값 ''
    # 설명 출처: 드라이버의 parameter file 주석
    description: "resolution and rate. Leave empty to remain on current the lidar mode"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.lidar_mode" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["512x10", "512x20", "1024x10", "1024x20", "2048x10", "4096x5"]
    lock_while_driving: true

  lidar_port:
    # 타입 int, 현재값 0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "port value should be in the range [0, 65535]. If you use 0 as the port value then the first available port number will be assigned"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.lidar_port" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  mask_path:
    # 타입 string, 현재값 ''
    # 설명 출처: 드라이버의 parameter file 주석
    description: "path to an image file that will be used to mask parts of the pointcloud"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # enum: []          # 허용 값이 정해져 있으면 적는다
    lock_while_driving: true

  max_failed_reconnect_attempts:
    # 타입 int, 현재값 2147483647
    # 설명 출처: 드라이버의 parameter file 주석
    description: "maximum number of attempts trying to communicate with the sensor. Counter resets upon successful connection"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  max_range:
    # 타입 double, 현재값 1000.0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "maximum lidar range to consider (meters)"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  metadata:
    # 타입 string, 현재값 ''
    # 설명 출처: 드라이버의 parameter file 주석
    description: "path to save metadata file to, if left empty a file with the sensor hostname or ip will be created in ~/.ros folder"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # enum: []          # 허용 값이 정해져 있으면 적는다
    lock_while_driving: true

  min_distance:
    # 타입 int, 현재값 -1
    # 설명 출처: 드라이버의 parameter file 주석
    description: "minimum distance to consider (cm). available options (FW3.1+): {0, 30} available options (FW3.2+): {0, 30, 50} default is -1 (unset)"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  min_range:
    # 타입 double, 현재값 0.0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "minimum lidar range to consider (meters)"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  min_scan_valid_columns_ratio:
    # 타입 double, 현재값 0.0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "The minimum ratio of valid columns for processing the LidarScan [0, 1]. default is 0%"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  mtp_dest:
    # 타입 string, 현재값 ''
    # 설명 출처: 드라이버의 parameter file 주석
    description: "hostname IP address for receiving data packets via multicast, by default it is INADDR_ANY, so packets will be received on first available network interface"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # enum: []          # 허용 값이 정해져 있으면 적는다
    lock_while_driving: true

  mtp_main:
    # 타입 bool, 현재값 False
    # 설명 출처: 드라이버의 parameter file 주석
    description: "if true, then configure and reinit the sensor, otherwise start client with active configuration of sensor"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  multipurpose_io_mode:
    # 타입 string, 현재값 'OFF'
    # 설명 출처: 드라이버의 parameter file 주석
    description: "multipurpose IO / time sync mode"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.multipurpose_io_mode" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["OFF", "INPUT_NMEA_UART", "OUTPUT_FROM_INTERNAL_OSC", "OUTPUT_FROM_SYNC_PULSE_IN", "OUTPUT_FROM_PTP_1588", "OUTPUT_FROM_ENCODER_ANGLE"]
    lock_while_driving: true

  nan_is_inf:
    # 타입 bool, 현재값 False
    # 설명 출처: 드라이버의 parameter file 주석
    description: "if true, laserscans with NaN values will be set to infinity instead of NaN"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  nmea_baud_rate:
    # 타입 string, 현재값 'BAUD_9600'
    # 설명 출처: 드라이버의 parameter file 주석
    description: "Expected baud for NMEA UART $GPRMC"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.nmea_baud_rate" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["BAUD_9600", "BAUD_115200"]
    lock_while_driving: true

  nmea_ignore_valid_char:
    # 타입 bool, 현재값 False
    # 설명 출처: 드라이버의 parameter file 주석
    description: "Set false if NMEA UART input $GPRMC messages should be ignored if valid character is not set, and true if messages should be used for time syncing regardless of the valid character"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.nmea_ignore_valid_char" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["true", "false"]
    lock_while_driving: true

  nmea_in_polarity:
    # 타입 string, 현재값 'ACTIVE_HIGH'
    # 설명 출처: 드라이버의 parameter file 주석
    description: "polarity for NMEA UART input"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.nmea_in_polarity" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["ACTIVE_HIGH", "ACTIVE_LOW"]
    lock_while_driving: true

  nmea_leap_seconds:
    # 타입 int, 현재값 0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "Set an integer number of leap seconds that will be added to the UDP timestamp when calculating seconds since 00:00:00 Thursday, 1 January 1970. For Unix Epoch time, this should be set to 0"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.nmea_leap_seconds" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["0", "1"]
    lock_while_driving: true

  operating_mode:
    # 타입 string, 현재값 'NORMAL'
    # 설명 출처: 드라이버의 parameter file 주석
    description: "sensor operating mode"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.operating_mode" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["NORMAL", "STANDBY"]
    lock_while_driving: true

  organized:
    # 타입 bool, 현재값 True
    # 설명 출처: 드라이버의 parameter file 주석
    description: "whether to generate an organized point cloud. default is organized"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  persist_config:
    # 타입 bool, 현재값 False
    # 설명 출처: 드라이버의 parameter file 주석
    description: "request the sensor to persist settings"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  phase_lock_enable:
    # 타입 bool, 현재값 False
    # 설명 출처: 드라이버의 parameter file 주석
    description: "enable or disable phase lock"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.phase_lock_enable" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  phase_lock_offset:
    # 타입 int, 현재값 0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "angle that sensors are locked to in millidegrees, values range [0, 360000]"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.phase_lock_offset" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  point_cloud_frame:
    # 타입 string, 현재값 'os_lidar'
    # 설명 출처: 드라이버의 parameter file 주석
    description: "which frame of reference to use when generating PointCloud2 or LaserScan messages, select between the values of lidar_frame and sensor_frame"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # enum: []          # 허용 값이 정해져 있으면 적는다
    # global_ref: frames.TODO   # 전역 frame 규칙을 따른다면
    lock_while_driving: true

  point_type:
    # 타입 string, 현재값 'original'
    # 설명 출처: 드라이버의 parameter file 주석
    description: "Here is a breif description of each option: - original: This uses the original point representation ouster_ros::Point of the ouster-ros driver. - native: directly maps all fields as published by the sensor to an equivalent point cloud representation with the additon of ring and timestamp fields. - xyz: the simplest point type, only has {x, y, z} - xyzi: same as xyz point type but adds intensity (signal) field. this type is not compatible with the low data profile. - o_xyzi: same as xyzi point type but doesn't add the extra 4 padding bytes. - xyzir: same as xyzi type but adds ring (channel) field. this type is same as Velodyne point cloud type this type is not compatible with the low data profile. - xyzrgb: same as xyz point type but adds RGB color fields. - xyzrgba: same as xyzrgb point type but publishes the packed color as PCL's RGBA field with an opaque alpha channel. - color_point: same as the original point type but adds RGB color fields. for more details about the fields of each point type and their data refer to the following header files: - ouster_ros/os_point.h - ouster_ros/sensor_point_types.h - ouster_ros/common_point_types.h"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
