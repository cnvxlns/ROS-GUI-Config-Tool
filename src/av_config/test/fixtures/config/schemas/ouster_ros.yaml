# ouster-ros 파라미터 스키마
#
# 자동 생성 파일이다. 직접 고치지 말고 오버레이를 고친 뒤 다시 생성하라.
#   tools/import_driver_params.py + config/overlays/ouster_ros.yaml
#
# 출처: https://github.com/ouster-lidar/ouster-ros (ros2 브랜치, 2026-09-24)
#       config/driver_params.yaml 의 주석에서 설명과 허용 값을 가져왔다.
#
# 소스에서 확인한 사실:
#   - declare_parameter 99회, ParameterDescriptor 0회
#     -> 실행 중 수집으로는 설명·범위·read_only 를 얻을 수 없다. 이 파일이 그 자리다.
#   - add_on_set_parameters_callback 0회
#     -> 실행 중 파라미터 변경을 지원하지 않는다. 모든 apply 가 restart 다.
#   - set_config 서비스는 string config_file(파일 경로)을 받아 센서를 reinit 한다
#     -> 값 하나만 넘기는 방식이 아니어서 현재 apply_via 모델로는 쓸 수 없다.
#   - get_config / get_metadata 로 장치의 실제 설정을 되읽을 수 있다
#
# 확인이 남은 것:
#   - readback_via 의 json_path 가 get_config 응답의 실제 키와 맞는지
#     ros2 service call /ouster/get_config ouster_sensor_msgs/srv/GetConfig
#   - 어떤 파라미터를 operator 등급으로 열지

driver: ouster_ros
match:
  node_name_regex: "^/ouster/os_driver$"
  required_services:
    - "/ouster/get_config"
    - "/ouster/get_metadata"

params:
  accel_fsr:
    # 타입 string, 현재값 ''
    # 설명 출처: 드라이버의 parameter file 주석
    description: "accelerometer full-scale range, default is '' (unset; requires FW 3.1+)"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.accel_fsr" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["NORMAL", "EXTENDED"]
    lock_while_driving: true

  attempt_reconnect:
    # 타입 bool, 현재값 False
    # 설명 출처: 드라이버의 parameter file 주석
    description: "attempting to reconnect to the sensor after connection loss or sensor powered down"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  azimuth_window_end:
    # 타입 int, 현재값 360000
    # 설명 출처: 드라이버의 parameter file 주석
    description: "values range [0, 360000] millidegrees"
    layer: device
    # TODO: 배열 인덱스를 지원하거나 start/end 를 묶어 다뤄야 한다
    readback_via: { service: "/ouster/get_config", json_path: "$.azimuth_window" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  azimuth_window_start:
    # 타입 int, 현재값 0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "values range [0, 360000] millidegrees"
    layer: device
    # TODO: 배열 인덱스를 지원하거나 start/end 를 묶어 다뤄야 한다
    readback_via: { service: "/ouster/get_config", json_path: "$.azimuth_window" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  bloom_reduction_optimization:
    # 타입 string, 현재값 ''
    # 설명 출처: 드라이버의 parameter file 주석
    description: "level of bloom reduction optimization to apply on the sensor; default is '' (unset; requires FW 3.2+)"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["BALANCED", "MINIMIZE_FALSE_POSITIVES"]
    lock_while_driving: true

  columns_per_packet:
    # 타입 int, 현재값 0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "number of columns per packet; default is 0 (unset); requires FW4.0+"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.columns_per_packet" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["1", "2", "4", "8", "16", "32", "64"]
    lock_while_driving: true

  destagger:
    # 타입 bool, 현재값 True
    # 설명 출처: 드라이버의 parameter file 주석
    description: "enable or disable point cloud destaggering, default enabled"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  dormant_period_between_reconnects:
    # 타입 double, 현재값 1.0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "wait time in seconds between reconnection attempts"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  gyro_fsr:
    # 타입 string, 현재값 ''
    # 설명 출처: 드라이버의 parameter file 주석
    description: "gyroscope full-scale range, default is '' (unset; requires FW 3.1+)"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.gyro_fsr" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["NORMAL", "EXTENDED"]
    lock_while_driving: true

  imu_frame:
    # 타입 string, 현재값 'os_imu'
    # 설명 출처: 드라이버의 parameter file 주석
    description: "name to use when referring to the imu frame"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # enum: []          # 허용 값이 정해져 있으면 적는다
    # global_ref: frames.TODO   # 전역 frame 규칙을 따른다면
    lock_while_driving: true

  imu_packets_per_frame:
    # 타입 int, 현재값 0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "number of IMU packets per frame, default is 0 (unset; requires FW3.2+)"
    layer: driver
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    # 허용 값 출처: 드라이버의 parameter file 주석
    enum: ["1", "2", "4", "8"]
    # global_ref: frames.TODO   # 전역 frame 규칙을 따른다면
    lock_while_driving: true

  imu_port:
    # 타입 int, 현재값 0
    # 설명 출처: 드라이버의 parameter file 주석
    description: "port value should be in the range [0, 65535]. If you use 0 as the port value then the first available port number will be assigned"
    layer: device
    readback_via: { service: "/ouster/get_config", json_path: "$.imu_port" }
    apply: restart       # 드라이버에 add_on_set_parameters_callback 이 없다
    tier: engineer
    lock_while_driving: true

  lidar_frame:
    # 타입 string, 현재값 'os_lidar'
    # 설명 출처: 드라이버의 parameter file 주석
